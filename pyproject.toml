[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "globalsim"
version = "0.1.0"
description = "Python bindings for the GlobalSim race simulation engine"
readme = "docs/PYTHON-DOCUMENTATION.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-only"}

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "globalsim._native"
