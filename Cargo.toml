[package]
name = "race_engine_rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

# Bin crate that speaks the same JSON-on-stdin/stdout contract the existing
# Node subprocess (race_simulator._run_simulation_node) uses -- a drop-in
# swap for the hot path only, not a rewrite of the server.
[lib]
name = "globalsim"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "race_engine_rs_v2"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
python = ["dep:pyo3"]
# JavaScript bindings (src/wasm.rs) for wasm32-unknown-unknown. Pair with
# external-geometry to keep the module small; see docs/WASM.md.
wasm = ["dep:wasm-bindgen"]
default = ["fast-alloc"]
# mimalloc as the global allocator: lower latency (needs a C compiler). Build
# with --no-default-features to use the platform allocator instead. Ignored on
# wasm targets, which always use the platform allocator.
fast-alloc = ["dep:mimalloc"]
# Leave the captured course geometry assets (data/course_geometry, most of the
# binary's size) out of the build; hosts register a course's geometry at
# runtime with `register_course_geometry` before preparing a race on it.
external-geometry = []
# Opt-in third-party comparison profile. See docs/EXPERIMENTAL.md.
experimental-umamoe = ["experimental-gap-refresh", "experimental-duel-hp"]
# Components can be evaluated independently against official captures.
experimental-gap-refresh = []
experimental-duel-hp = []
# Separately opt in: this timing rule conflicts with official captures.
experimental-spot-cutoff = []
# Stage forward-style pacemaker restoration before the other styles adopt it.
experimental-pacemaker-staging = []
# Evaluate whole-metre rounding of the lead-competition entry distance.
experimental-spot-entry-floor = []
# Opt-in numerical compatibility with captured third-party pacing lotteries.
experimental-pacing-log = []

[dependencies]
pyo3 = { version = "0.23", optional = true, features = ["extension-module", "abi3-py39"] }
wasm-bindgen = { version = "0.2.130", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1.52", optional = true, default-features = false }
